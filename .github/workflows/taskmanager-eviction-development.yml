# Focused, read-only validation for the cooperative eviction feature branch.
name: TaskManager eviction validation
on:
  push:
    branches: [codex/taskmanager-graceful-eviction]
    paths:
      - '.github/workflows/taskmanager-eviction-development.yml'
      - 'flink-core/**'
      - 'flink-runtime/**'
      - 'flink-kubernetes/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taskmanager-eviction-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'huyuanfeng2018/flink'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package reactor dependencies including the isolated RPC system
        run: |
          set -euo pipefail
          ./mvnw -B -T 2 -pl flink-kubernetes -am -DskipTests install 2>&1 | tee /tmp/flink-eviction-build.log
      - name: Validate runtime and Kubernetes integration
        run: |
          set -euo pipefail
          ./mvnw -B -T 2 -pl flink-kubernetes -am \
            -Dtest='*Eviction*,BlocklistDeclarativeSlotPoolTest,DefaultDeclarativeSlotPoolTest,DeclarativeSlotPoolBridgeTest,DefaultSchedulerTest,AdaptiveSchedulerTest,ExecutingTest,JobMasterTest,FineGrainedSlotManagerTest,ActiveResourceManagerTest,ResourceManagerTest,KubernetesPodTest,KubernetesResourceManagerDriverTest' \
            -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee /tmp/flink-eviction-validation.log
      - name: Publish test reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flink-eviction-test-reports
          retention-days: 7
          path: |
            flink-*/target/surefire-reports/
            flink-*/target/test-classes/log4j-test.properties
            /tmp/flink-eviction-build.log
            /tmp/flink-eviction-validation.log
